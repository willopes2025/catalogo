# Instalação numa VPS que já tem outros sistemas e um Caddy próprio (ex.: VPS Hostinger da Wide).
# Não publica as portas 80/443 nem a 5432: o banco fica só na rede interna,
# a API e o painel ouvem apenas no 127.0.0.1, e o Caddy existente faz o HTTPS.
name: aritana

services:
  db:
    image: postgres:16-alpine
    container_name: aritana-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: aritana
      POSTGRES_USER: aritana
      POSTGRES_PASSWORD: ${DB_PASSWORD:?defina DB_PASSWORD no .env}
    volumes:
      - aritana_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aritana"]
      interval: 5s
      retries: 20
    networks: [interna]

  api:
    build: { context: ., dockerfile: infra/api.Dockerfile }
    container_name: aritana-api
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgres://aritana:${DB_PASSWORD}@db:5432/aritana
      ARQUIVOS_DIR: /dados
      # Servidor de WhatsApp por QR code (abaixo), falando pela rede interna
      EVOLUTION_URL: http://aritana-whatsapp:8080
      EVOLUTION_WEBHOOK_URL: http://aritana-api:3000
    volumes:
      # Fotos dos produtos (copiadas todo dia para /opt/aritana-backups/arquivos)
      - /opt/aritana-arquivos:/dados
    depends_on:
      db: { condition: service_healthy }
    ports:
      - "127.0.0.1:${PORTA_API:-3310}:3000"
    networks: [interna]

  # WhatsApp por QR code (Evolution API, código aberto). Sem porta aberta: só a API do sistema fala com ele.
  # A sessão de cada celular fica no volume aritana_whatsapp e no banco "evolution" (o mesmo Postgres, base separada).
  whatsapp:
    image: ${EVOLUTION_IMAGE:-evoapicloud/evolution-api:v2.3.7}
    container_name: aritana-whatsapp
    restart: unless-stopped
    environment:
      SERVER_URL: http://aritana-whatsapp:8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?rode o instalador para criar EVOLUTION_API_KEY no .env}
      DEL_INSTANCE: "false"
      LANGUAGE: pt-BR
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://aritana:${DB_PASSWORD}@db:5432/evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: aritana
      DATABASE_SAVE_DATA_INSTANCE: "true"
      # As conversas ficam no banco do sistema; o servidor de WhatsApp não guarda cópia.
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "false"
      DATABASE_SAVE_DATA_CHATS: "false"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "false"
      CACHE_LOCAL_ENABLED: "true"
      WEBHOOK_GLOBAL_ENABLED: "false"
      CONFIG_SESSION_PHONE_CLIENT: Aritana
      CONFIG_SESSION_PHONE_NAME: Chrome
      CONFIG_SESSION_PHONE_VERSION: ${EVOLUTION_VERSAO_WHATSAPP:-}
      QRCODE_LIMIT: "30"
      LOG_LEVEL: ERROR,WARN
      LOG_BAILEYS: error
    volumes:
      - aritana_whatsapp:/evolution/instances
    depends_on:
      db: { condition: service_healthy }
    networks: [interna]

  painel:
    build: { context: ., dockerfile: infra/painel.Dockerfile }
    container_name: aritana-painel
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORTA_PAINEL:-3311}:80"
    networks: [interna]

volumes:
  aritana_db:
  aritana_whatsapp:

networks:
  interna:
    name: aritana_interna
