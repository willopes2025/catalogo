server {
  listen 80;
  root /usr/share/nginx/html;

  gzip on;
  gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;

  # Arquivos com hash no nome nunca mudam: podem ficar no cache por um ano
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # Página principal, service worker e manifesto: sempre conferir se há versão nova (evita tela branca depois de atualizar)
  location = /index.html { add_header Cache-Control "no-cache"; }
  location = /portal-sw.js { add_header Cache-Control "no-cache"; }
  # Manifesto do app da representante: tipo certo para o celular oferecer "instalar"
  location = /portal.webmanifest { types { } default_type application/manifest+json; add_header Cache-Control "no-cache"; }

  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
